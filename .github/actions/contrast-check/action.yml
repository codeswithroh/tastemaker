name: 'Tastemaker Contrast Check'
description: 'Reads palette and legal pairings from .tastemaker/style-lock.md and checks for contrast regressions that would break a text-safe pairing'
inputs:
  style-lock:
    description: 'Path to style-lock.md (repo-relative)'
    required: false
    default: '.tastemaker/style-lock.md'
  json-output:
    description: 'If true, emit JSON to stdout (still fails non-zero on regression)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Run contrast regression check
      shell: bash
      run: |
        set -euo pipefail
        SCRIPT_PATH="${{ github.action_path }}/../../skills/tastemaker/scripts/check_contrast.py"
        if [ ! -f "$SCRIPT_PATH" ]; then
          SCRIPT_PATH="./skills/tastemaker/scripts/check_contrast.py"
        fi
        if [ ! -f "$SCRIPT_PATH" ]; then
          echo "::error::check_contrast.py not found at $SCRIPT_PATH (and ./skills/tastemaker/scripts/check_contrast.py)" >&2
          exit 1
        fi
        LOCK="${{ inputs.style-lock }}"
        if [ "${{ inputs.json-output }}" = "true" ]; then
          python3 "$SCRIPT_PATH" --json --check-lock "$LOCK"
        else
          python3 "$SCRIPT_PATH" --check-lock "$LOCK"
        fi
