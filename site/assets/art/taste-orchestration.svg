<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
  <title id="title">Tastemaker visual orchestration</title>
  <desc id="desc">Abstract layered panels, ribbons, swatches, and interface fragments showing a prompt becoming a designed screen.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172626"/>
      <stop offset="1" stop-color="#071010"/>
    </linearGradient>
    <linearGradient id="orchid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B9FF"/>
      <stop offset="0.56" stop-color="#BE85CE"/>
      <stop offset="1" stop-color="#6D3E78"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73F0E1"/>
      <stop offset="1" stop-color="#008286"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="18" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.04 0 0 0 0 0.04 0 0 0 .52 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="680" rx="44" fill="#0C1414"/>
  <path d="M64 98 C190 12 276 168 410 86 C552 0 662 64 850 24 L850 652 C700 582 548 704 402 604 C250 500 152 612 64 548 Z" fill="url(#ink)"/>
  <path d="M42 490 C210 330 316 616 498 438 C650 288 704 246 880 332" fill="none" stroke="url(#orchid)" stroke-width="44" stroke-linecap="round" opacity=".92"/>
  <path d="M40 284 C178 420 340 134 512 276 C674 410 730 154 878 230" fill="none" stroke="url(#teal)" stroke-width="28" stroke-linecap="round" opacity=".8"/>
  <g filter="url(#soft)">
    <rect x="96" y="110" width="290" height="210" rx="24" fill="#E5F6F6"/>
    <rect x="120" y="136" width="72" height="10" rx="5" fill="#BE85CE"/>
    <rect x="120" y="170" width="182" height="20" rx="10" fill="#172626"/>
    <rect x="120" y="208" width="230" height="14" rx="7" fill="#A8BABA"/>
    <rect x="120" y="236" width="170" height="14" rx="7" fill="#A8BABA"/>
    <rect x="120" y="278" width="92" height="18" rx="9" fill="#008286"/>
  </g>
  <g filter="url(#soft)">
    <rect x="510" y="84" width="300" height="250" rx="28" fill="#111A1A" stroke="#355152" stroke-width="2"/>
    <rect x="538" y="116" width="60" height="60" rx="16" fill="#BE85CE"/>
    <rect x="614" y="126" width="128" height="16" rx="8" fill="#E5F6F6"/>
    <rect x="614" y="158" width="164" height="10" rx="5" fill="#A8BABA"/>
    <rect x="538" y="210" width="224" height="8" rx="4" fill="#008286"/>
    <rect x="538" y="238" width="176" height="8" rx="4" fill="#355152"/>
    <rect x="538" y="266" width="208" height="8" rx="4" fill="#355152"/>
  </g>
  <g filter="url(#soft)">
    <rect x="232" y="382" width="400" height="188" rx="26" fill="#171F1F" stroke="#355152" stroke-width="2"/>
    <rect x="260" y="412" width="96" height="12" rx="6" fill="#BE85CE"/>
    <path d="M272 514 L334 466 L392 494 L456 438 L580 514" fill="none" stroke="#73F0E1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="334" cy="466" r="12" fill="#E5F6F6"/>
    <circle cx="456" cy="438" r="12" fill="#E5F6F6"/>
  </g>
  <g opacity=".72">
    <rect x="706" y="420" width="38" height="136" rx="19" fill="#F2B9FF"/>
    <rect x="756" y="378" width="38" height="178" rx="19" fill="#73F0E1"/>
    <rect x="806" y="450" width="38" height="106" rx="19" fill="#E5F6F6"/>
  </g>
